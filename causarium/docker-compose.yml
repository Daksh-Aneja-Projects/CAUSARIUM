version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: causarium
      POSTGRES_PASSWORD: password
      POSTGRES_DB: causarium
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causarium"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.5.0
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URL
      - REDIS_URL
      - NEO4J_URL
      - NEO4J_USER
      - NEO4J_PASSWORD
      - QDRANT_URL
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - JWT_SECRET_KEY
      - JWT_ALGORITHM
      - ACCESS_TOKEN_EXPIRE_MINUTES
      - CELERY_BROKER_URL
      - CELERY_RESULT_BACKEND
      - ENVIRONMENT
      - LOG_LEVEL
      - TENANT_MODE
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A workers.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_URL
      - REDIS_URL
      - NEO4J_URL
      - NEO4J_USER
      - NEO4J_PASSWORD
      - QDRANT_URL
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - JWT_SECRET_KEY
      - JWT_ALGORITHM
      - ACCESS_TOKEN_EXPIRE_MINUTES
      - CELERY_BROKER_URL
      - CELERY_RESULT_BACKEND
      - ENVIRONMENT
      - LOG_LEVEL
      - TENANT_MODE
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
